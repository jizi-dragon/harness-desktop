name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The actual point of running on macos-latest/ubuntu-latest: the
  # #[cfg(unix)] branches in server.rs (own_process_group, kill_process_tree's
  # SIGTERM path, ...) are entirely excluded from compilation on Windows —
  # cfg-gated code that doesn't match isn't "compiled but unrun", it's not
  # compiled at all. Deliberately `cargo check`, not `tauri build`: this only
  # answers "does the platform-generic Rust code compile here."
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Only Linux needs system deps for the webview/tray bits `cargo check`
      # still needs headers for, even though this job never links a binary.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features

  # Does the bundler actually produce an installable artifact on macOS/Linux.
  # Uses `tauri build --bundles <fmt>` — a per-invocation CLI override —
  # specifically so this never touches tauri.conf.json's shared
  # `bundle.targets: ["nsis"]`. No code signing/notarization attempted; this
  # only answers "does the bundler run and produce a file".
  bundle-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            format: dmg
            glob: "src-tauri/target/release/bundle/dmg/*.dmg"
          - os: ubuntu-latest
            format: deb
            glob: "src-tauri/target/release/bundle/deb/*.deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install
      - run: npx tauri build --bundles ${{ matrix.format }}
      - name: Verify a bundle artifact was actually produced
        shell: bash
        run: |
          shopt -s nullglob
          files=(${{ matrix.glob }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no ${{ matrix.format }} artifact matched ${{ matrix.glob }}"
            exit 1
          fi
          ls -la "${files[@]}"
