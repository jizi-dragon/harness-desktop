name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Windows is the only platform actually shipping (the signed NSIS release).
  # Building by hand rather than tauri-apps/tauri-action keeps the artifacts
  # under this repo's control; no updater channel is configured (the app has
  # no auto-update), so there are no signing keys or latest.json to produce.
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: npm install
      - run: npm run check:dsh-version
      - run: npm run build

      - name: Create draft release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$nsisDir/*.exe" | Select-Object -First 1
          gh release create "${{ github.ref_name }}" `
            "$($exe.FullName)" `
            --repo ${{ github.repository }} `
            --draft `
            --title "DeepSeek Harness Desktop ${{ github.ref_name }}"
